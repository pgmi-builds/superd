# Replace the single-slot AgentRegistry with the multi-slot MultiAgentRegistry.
# cordis-plugin-include (0.1.3-alpha.2) treats a patch row's `name` as a
# mis-target guard only — it can never be assigned — so the swap is
# disable-original + insert-replacement, not a name repoint.
- id: agent
  name: '@deepseek-ai/dsh-agent'   # guard: skip if upstream row changed
  disabled: true
- insert:
    - id: agent-multi
      name: '@pgmi-builds/dsh-multi-agent-registry'
